# Демонстрационный набор открытых лент. Веса простые и зависят только от типа источника.
# kind: official | news | analysis
defaults:
  timeout_connect_sec: 3
  timeout_total_sec: 8
  failures_before_pause: 3
  pause_after_failures_min: 30
  user_agent: Mozilla/5.0 (compatible; HoneyMoneyNews/1.0)
domain_limits:
  default:
    min_interval_sec: 2
    max_parallel: 2
